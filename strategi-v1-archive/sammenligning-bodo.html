<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Strategi-sammenligning — Bodø</title>
<link rel="stylesheet" href="../style.css">
<script>window.SA_BASE = '../';</script>
<script src="../theme.js"></script>
<script src="../selskaper.js"></script>
<style>
  .main-content { padding: 0 0 60px }
  .page-header {
    padding: 22px 32px 18px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .page-header .ph-crumb {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
    font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .page-header h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.012em }
  .page-header .ph-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted) }
  .container { padding: 22px 32px; max-width: 1400px }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600 }
  .panel .lead { color: var(--muted); font-size: 12px; margin: 0 0 14px }

  .two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  @media (max-width: 1000px) { .two-col { grid-template-columns: 1fr } }

  .selskap-card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; border-top: 4px solid var(--selskap-color, var(--accent));
  }
  .selskap-card h3 {
    margin: 0 0 2px; font-size: 14px; font-weight: 700;
    color: var(--selskap-color, var(--text));
  }
  .selskap-card .meta {
    font-size: 11px; color: var(--muted); margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .selskap-card .intensjon {
    font-size: 13px; line-height: 1.55; font-style: italic;
    padding: 10px 12px; background: var(--panel); border-radius: 6px;
    border-left: 3px solid var(--selskap-color, var(--accent));
    margin: 0;
  }

  .swot-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px }
  .swot-mini-quad {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; border-top: 2px solid var(--quad-color, var(--accent));
  }
  .swot-mini-quad.q-s { --quad-color: var(--good) }
  .swot-mini-quad.q-w { --quad-color: var(--bad) }
  .swot-mini-quad.q-o { --quad-color: var(--hi) }
  .swot-mini-quad.q-t { --quad-color: var(--warn) }
  .swot-mini-quad h4 {
    margin: 0 0 8px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--quad-color);
  }
  .swot-mini-quad ul { margin: 0; padding-left: 16px; list-style: disc }
  .swot-mini-quad li { font-size: 11.5px; line-height: 1.45; padding: 2px 0 }

  .horisont-row {
    display: grid; grid-template-columns: 60px 1fr 1fr; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .horisont-row:last-child { border-bottom: 0 }
  .horisont-row .h-lbl {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); padding-top: 2px;
  }
  .horisont-row .h-content {
    padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; border-left: 3px solid var(--selskap-color, var(--accent));
  }
  .horisont-row .h-content .h-tittel {
    font-size: 12px; font-weight: 700; margin-bottom: 2px;
  }
  .horisont-row .h-content .h-periode {
    font-size: 10.5px; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .horisont-row .h-content .h-fokus {
    font-size: 12px; line-height: 1.5; color: var(--text);
  }

  .init-row {
    display: grid; grid-template-columns: 30px 60px 1fr 80px 90px;
    gap: 12px; align-items: center;
    padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 6px;
    border-left: 3px solid var(--selskap-color, var(--accent));
    font-size: 12px;
  }
  .init-row .init-nr {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
  }
  .init-row .init-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: 3px; text-align: center;
    background: var(--selskap-color, var(--accent)); color: #fff;
  }
  .init-row .init-tag.t-areal { background: #66c2cc; color: #0e1116 }
  .init-row .init-tag.t-fritzoe { background: #4f9da6; color: #fff }
  .init-row .init-navn { font-weight: 600 }
  .init-row .init-hor { font-size: 11px; color: var(--muted); text-align: center }
  .init-row .init-status {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    text-align: center; padding: 3px 8px; border-radius: 4px;
    background: var(--panel-3); color: var(--muted);
  }
  .init-row .init-status.s-pa-sporet { background: var(--good); color: #0e1116 }
  .init-row .init-status.s-i-planlegging { background: var(--hi); color: #fff }
  .init-row .init-status.s-risiko { background: var(--warn); color: #0e1116 }
  .init-row .init-status.s-ikke-startet { background: var(--panel-3); color: var(--muted) }

  .common-context {
    padding: 14px 18px; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--mode-strategisk, #d29922);
    border-radius: 8px;
  }
  .common-context .cc-lbl {
    font-size: 10.5px; color: var(--mode-strategisk, #d29922);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
  }
  .common-context p {
    margin: 6px 0 0; font-size: 13px; line-height: 1.5;
  }

  .wrong-scope-notice {
    padding: 20px 24px; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--warn); border-radius: 8px;
    font-size: 13px; line-height: 1.55;
  }
  .wrong-scope-notice a { color: var(--accent); text-decoration: none; font-weight: 600 }
</style>
</head>
<body>

<div data-sidebar data-active="sammenligning-bodo" data-section="strategi"></div>

<main class="main-content">

  <header class="page-header">
    <div class="ph-crumb">
      <span class="mode-pill" data-mode="strategisk">Strategisk</span>
      <span>Strategi-sammenligning · Bodø</span>
    </div>
    <h1>Strategi-sammenligning — Bodø</h1>
    <div class="ph-sub">Fritzøe og Areal side-om-side · samme DL og adresse · komplementær fagprofil</div>
  </header>

  <div class="container" id="content"></div>

</main>

<script src="../sidebar.js"></script>
<script>
function init() {
  const fritzoe = getSelskap('byggmester-fritzoe');
  const areal   = getSelskap('areal-byggservice');
  const content = document.getElementById('content');

  if (!fritzoe || !areal || !fritzoe.strategi || !areal.strategi) {
    content.innerHTML = '<div class="wrong-scope-notice">Strategi-data mangler for Fritzøe eller Areal.</div>';
    return;
  }

  // Felles kontekst (DL, adresse, eier-ramme)
  let html = `
    <div class="common-context">
      <div class="cc-lbl">Felles ramme</div>
      <p>
        ${fritzoe.kortnavn} og ${areal.kortnavn} har samme daglig leder (${fritzoe.ledelse.dl_kort}),
        deler kontor (${fritzoe.lokasjon.adresse}) og samme styre. Strategiene utvikles likevel
        som to selvstendige forslag — denne siden viser dem side-om-side så DL kan se hvor
        de overlapper og hvor de komplementerer hverandre.
      </p>
    </div>
  `;

  // 1. Intensjon side-om-side
  html += '<div class="panel"><h2>Strategisk intensjon</h2>';
  html += '<p class="lead">Hva hvert selskap har som retning. Skal lese sammenhengende på tvers.</p>';
  html += '<div class="two-col">';
  [fritzoe, areal].forEach(s => {
    html += `
      <div class="selskap-card" style="--selskap-color:${s.farge}">
        <h3>${s.label}</h3>
        <div class="meta">${s.fagprofil}</div>
        <p class="intensjon">${s.strategi.intensjon}</p>
      </div>
    `;
  });
  html += '</div></div>';

  // 2. SWOT side-om-side
  html += '<div class="panel"><h2>SWOT</h2>';
  html += '<p class="lead">Hver SWOT er selvstendig, men ses i sammenheng på Bodø-by-nivå.</p>';
  html += '<div class="two-col">';
  [fritzoe, areal].forEach(s => {
    const sw = s.strategi.swot;
    html += `
      <div class="selskap-card" style="--selskap-color:${s.farge}">
        <h3>${s.kortnavn}</h3>
        <div class="meta">${s.regnskap_2024.omsetning_mnok.toFixed(0)} MNOK 2024 · ${s.regnskap_2024.ansatte} ansatte</div>
        <div class="swot-mini">
          <div class="swot-mini-quad q-s"><h4>Styrker</h4><ul>${sw.styrker.slice(0,4).map(x => `<li>${x}</li>`).join('')}</ul></div>
          <div class="swot-mini-quad q-w"><h4>Svakheter</h4><ul>${sw.svakheter.slice(0,4).map(x => `<li>${x}</li>`).join('')}</ul></div>
          <div class="swot-mini-quad q-o"><h4>Muligheter</h4><ul>${sw.muligheter.slice(0,4).map(x => `<li>${x}</li>`).join('')}</ul></div>
          <div class="swot-mini-quad q-t"><h4>Trusler</h4><ul>${sw.trusler.slice(0,4).map(x => `<li>${x}</li>`).join('')}</ul></div>
        </div>
      </div>
    `;
  });
  html += '</div></div>';

  // 3. Horisonter (H1/H2/H3) — felles tabell med en rad per horisont
  html += '<div class="panel"><h2>Three Horizons</h2>';
  html += '<p class="lead">Hvordan hvert selskap ser de tre tidshorisontene 2026 · 2027–2028 · 2029+.</p>';
  ['h1', 'h2', 'h3'].forEach(hKey => {
    const hF = fritzoe.strategi.horisonter[hKey];
    const hA = areal.strategi.horisonter[hKey];
    html += `
      <div class="horisont-row">
        <div class="h-lbl">${hKey.toUpperCase()}</div>
        <div class="h-content" style="--selskap-color:${fritzoe.farge}">
          <div class="h-tittel">${hF.tittel}</div>
          <div class="h-periode">${fritzoe.kortnavn} · ${hF.periode} · ${hF.scenario}</div>
          <div class="h-fokus">${hF.fokus}</div>
        </div>
        <div class="h-content" style="--selskap-color:${areal.farge}">
          <div class="h-tittel">${hA.tittel}</div>
          <div class="h-periode">${areal.kortnavn} · ${hA.periode} · ${hA.scenario}</div>
          <div class="h-fokus">${hA.fokus}</div>
        </div>
      </div>
    `;
  });
  html += '</div>';

  // 4. Initiativer — samlet liste med selskap-tag
  html += '<div class="panel"><h2>Strategiske initiativer</h2>';
  html += '<p class="lead">Alle initiativer fra begge selskaper i én tabell — tagget med selskap, horisont og status. Bruk for å se hvor de overlapper.</p>';
  const allInit = [
    ...fritzoe.strategi.initiativer.map(i => ({...i, _selskap: fritzoe.kortnavn, _tag: 'fritzoe', _farge: fritzoe.farge})),
    ...areal.strategi.initiativer.map(i => ({...i, _selskap: areal.kortnavn, _tag: 'areal', _farge: areal.farge})),
  ].sort((a, b) => {
    const horOrder = { 'H1': 1, 'H1–H2': 2, 'H2': 3, 'H2–H3': 4, 'H3': 5 };
    return (horOrder[a.horisont] || 9) - (horOrder[b.horisont] || 9);
  });
  allInit.forEach(i => {
    html += `
      <div class="init-row" style="--selskap-color:${i._farge}">
        <div class="init-nr">#${i.nr}</div>
        <div class="init-tag t-${i._tag}">${i._selskap}</div>
        <div class="init-navn">${i.navn}</div>
        <div class="init-hor">${i.horisont}</div>
        <div class="init-status s-${i.status}">${i.status.replace(/-/g, ' ')}</div>
      </div>
    `;
  });
  html += '</div>';

  content.innerHTML = html;
}

init();
window.addEventListener('scope-changed', init);
</script>
</body>
</html>

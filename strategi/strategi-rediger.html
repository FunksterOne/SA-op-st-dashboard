<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Editer strategi — ServiceAlliansen Bygg</title>
<link rel="stylesheet" href="../style.css">
<script>window.SA_BASE = '../';</script>
<script src="../theme.js"></script>
<script src="../selskaper.js"></script>
<style>
  .main-content { padding: 0 0 60px }
  .page-header {
    padding: 22px 32px 18px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .page-header .ph-crumb {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
    font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .page-header h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.012em }
  .page-header .ph-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted) }
  .container { padding: 22px 32px; max-width: 980px }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600 }
  .panel .lead { color: var(--muted); font-size: 12px; margin: 0 0 14px }

  /* Skjema-elementer */
  .field { margin-bottom: 14px }
  .field-label {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 4px;
  }
  .field-help { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: italic }
  .field input[type="text"], .field input[type="date"], .field input[type="number"],
  .field select, .field textarea {
    width: 100%; padding: 8px 10px; font-size: 13px; line-height: 1.5;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .field textarea { min-height: 70px; resize: vertical }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
  @media (max-width: 700px) { .field-row { grid-template-columns: 1fr } }

  /* SWOT 2x2 */
  .swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
  @media (max-width: 700px) { .swot-grid { grid-template-columns: 1fr } }
  .swot-cell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px; border-top: 3px solid var(--quad-color, var(--accent));
  }
  .swot-cell.q-s { --quad-color: var(--good) }
  .swot-cell.q-w { --quad-color: var(--bad) }
  .swot-cell.q-o { --quad-color: var(--hi) }
  .swot-cell.q-t { --quad-color: var(--warn) }
  .swot-cell h4 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--quad-color);
  }
  .swot-cell textarea { min-height: 100px; background: var(--panel) }

  /* List-felter (initiativer, pestel, strategy-map) */
  .list-row {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px; position: relative;
  }
  .list-row-num {
    position: absolute; top: 10px; right: 10px; font-size: 10.5px;
    color: var(--muted); font-weight: 700;
  }
  .list-row-grid { display: grid; gap: 8px }
  .list-row-grid.g-pestel { grid-template-columns: 130px 1fr 90px }
  .list-row-grid.g-horisont { grid-template-columns: 1fr 130px 130px }
  .list-row-grid.g-init { grid-template-columns: 60px 1fr 130px 130px }
  .list-row-grid.g-init-row2 { grid-template-columns: 1fr 1fr }
  .list-row-grid.g-init-row3 { grid-template-columns: 1fr }
  .list-row-grid.g-sm { grid-template-columns: 1fr 120px 120px 120px 90px }
  @media (max-width: 800px) {
    .list-row-grid.g-pestel,
    .list-row-grid.g-horisont,
    .list-row-grid.g-init,
    .list-row-grid.g-init-row2,
    .list-row-grid.g-sm { grid-template-columns: 1fr }
  }
  .add-btn {
    background: transparent; border: 1px dashed var(--line); color: var(--muted);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: all 0.15s; width: 100%; font-family: inherit;
  }
  .add-btn:hover { color: var(--accent); border-color: var(--accent) }
  .remove-btn {
    position: absolute; top: 8px; right: 8px;
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 16px; padding: 4px 8px; border-radius: 4px;
  }
  .remove-btn:hover { color: var(--bad); background: var(--panel) }

  /* Push-knapper */
  .push-bar {
    position: sticky; bottom: 0; padding: 14px 22px;
    background: var(--panel); border: 1px solid var(--line);
    border-top: 3px solid var(--accent); border-radius: 8px;
    margin-top: 22px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .push-bar .pw-field { flex: 1 1 200px }
  .push-bar input[type="password"], .push-bar input[type="text"] {
    width: 100%; padding: 8px 10px; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-family: inherit;
  }
  .push-bar button {
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .push-bar button:hover { background: var(--accent-2) }
  .push-bar button:disabled { opacity: 0.5; cursor: not-allowed }
  .push-result {
    margin-top: 10px; padding: 12px 14px; border-radius: 6px; font-size: 13px;
  }
  .push-result.ok    { background: var(--good-soft, rgba(63,185,80,0.15)); color: var(--good); border: 1px solid var(--good) }
  .push-result.error { background: var(--bad-soft, rgba(248,81,73,0.15));  color: var(--bad);  border: 1px solid var(--bad) }
  .push-result a { color: inherit; font-weight: 600 }

  .wrong-scope {
    padding: 20px 24px; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--warn); border-radius: 8px;
    font-size: 13px; line-height: 1.55;
  }
  .wrong-scope a { color: var(--accent); text-decoration: none; font-weight: 600 }
</style>
</head>
<body>

<div data-sidebar data-active="strategi-doc" data-section="strategi"></div>

<main class="main-content">
  <header class="page-header">
    <div class="ph-crumb">
      <span class="mode-pill" data-mode="strategisk">Strategisk</span>
      <span>Editer strategi</span>
    </div>
    <h1 id="ph-title">Editer strategi</h1>
    <div class="ph-sub" id="ph-sub">Skjema-basert redigering · pusher direkte til main</div>
  </header>

  <div class="container" id="content"></div>
</main>

<script src="../sidebar.js"></script>
<script>
// =====================================================================
// Vercel-funksjonens URL — sett etter at Vercel-prosjektet er deployet
// =====================================================================
// Default: prøver en plausibel URL basert på repo-navnet. Endre om Vercel-
// prosjektet har annet navn. Du kan også overstyre lokalt ved å sette
// localStorage.STRATEGI_PUSH_URL i devtools.
const DEFAULT_PUSH_URL = 'https://sa-op-st-dashboard.vercel.app/api/push-strategi';
const PUSH_URL = localStorage.getItem('STRATEGI_PUSH_URL') || DEFAULT_PUSH_URL;

// =====================================================================
// Init — sjekk scope og last selskapets strategi
// =====================================================================
const scope = getActiveScope();
const content = document.getElementById('content');

if (scope.type !== 'selskap') {
  content.innerHTML = `
    <div class="wrong-scope">
      Velg et selskap fra scope-velgeren før du editerer strategien.
      Form-editoren krever selskap-scope. <a href="strategi-doc.html">← Tilbake til strategi-dokument</a>
    </div>
  `;
} else {
  const selskap = getSelskap(scope.id);
  if (!selskap || !selskap.strategi) {
    content.innerHTML = `<div class="wrong-scope">Strategi-data mangler for ${scope.id}.</div>`;
  } else {
    renderEditor(selskap);
  }
}

function renderEditor(selskap) {
  document.getElementById('ph-title').textContent = `Editer strategi — ${selskap.label}`;
  document.getElementById('ph-title').style.color = selskap.farge;
  document.getElementById('ph-sub').textContent =
    `Skriv inn endringer og klikk «Push til main». Live på Pages om ~30 sek.`;

  const s = JSON.parse(JSON.stringify(selskap.strategi)); // dyp kopi, lokal mutasjon

  // Bygg skjema
  content.innerHTML = `
    <div class="panel">
      <h2>Metadata</h2>
      <p class="lead">Status og sporing av redigeringen.</p>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Utkast-status</label>
          <select id="f-utkast_status">
            <option value="utkast">utkast (ikke validert)</option>
            <option value="validert">validert (DL står for innholdet)</option>
            <option value="vedtatt">vedtatt (godkjent av styret)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Sist endret</label>
          <input type="date" id="f-sist_endret">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Sist endret av</label>
        <input type="text" id="f-sist_endret_av" placeholder="Ditt navn">
      </div>
    </div>

    <div class="panel">
      <h2>Strategisk intensjon</h2>
      <p class="lead">Hvor selskapet skal — én tydelig setning, og en kort versjon til header.</p>
      <div class="field">
        <label class="field-label">Intensjon (lang)</label>
        <textarea id="f-intensjon" rows="3"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Intensjon kort (3–5 ord)</label>
        <input type="text" id="f-intensjon_kort">
      </div>
    </div>

    <div class="panel">
      <h2>SWOT</h2>
      <p class="lead">Én linje per punkt i hver kvadrant. Trykk Enter for å legge til nytt punkt.</p>
      <div class="swot-grid">
        <div class="swot-cell q-s"><h4>Styrker</h4><textarea id="f-swot-styrker"></textarea></div>
        <div class="swot-cell q-w"><h4>Svakheter</h4><textarea id="f-swot-svakheter"></textarea></div>
        <div class="swot-cell q-o"><h4>Muligheter</h4><textarea id="f-swot-muligheter"></textarea></div>
        <div class="swot-cell q-t"><h4>Trusler</h4><textarea id="f-swot-trusler"></textarea></div>
      </div>
    </div>

    <div class="panel">
      <h2>PESTEL</h2>
      <p class="lead">Fem dimensjoner — kategori, kort tekst, og om trenden går opp, ned eller er flat.</p>
      <div id="f-pestel"></div>
    </div>

    <div class="panel">
      <h2>Three Horizons</h2>
      <p class="lead">H1 (i år) · H2 (2027–2028) · H3 (2029+).</p>
      <div id="f-horisonter"></div>
    </div>

    <div class="panel">
      <h2>Strategiske initiativer</h2>
      <p class="lead">Hovedtiltakene som driver strategien fremover. Sortert etter nr.</p>
      <div id="f-initiativer"></div>
      <button class="add-btn" onclick="addInitiativ()">+ Legg til initiativ</button>
    </div>

    <div class="panel">
      <h2>Strategy map (Balanced Scorecard)</h2>
      <p class="lead">Måltall fordelt på finansielt, kunde, prosess og læring.</p>
      <div id="f-strategy_map"></div>
    </div>

    <div class="push-bar">
      <div class="pw-field">
        <input type="password" id="f-passord" placeholder="DL-passord (settes som env-var i Vercel)">
      </div>
      <button id="push-btn" onclick="pushStrategi()">Push til main →</button>
    </div>
    <div id="push-result"></div>
  `;

  // Forfyll feltene
  document.getElementById('f-utkast_status').value = s.utkast_status || 'utkast';
  document.getElementById('f-sist_endret').value = s.sist_endret || new Date().toISOString().slice(0, 10);
  document.getElementById('f-sist_endret_av').value = s.sist_endret_av || '';
  document.getElementById('f-intensjon').value = s.intensjon || '';
  document.getElementById('f-intensjon_kort').value = s.intensjon_kort || '';
  document.getElementById('f-swot-styrker').value = (s.swot.styrker || []).join('\n');
  document.getElementById('f-swot-svakheter').value = (s.swot.svakheter || []).join('\n');
  document.getElementById('f-swot-muligheter').value = (s.swot.muligheter || []).join('\n');
  document.getElementById('f-swot-trusler').value = (s.swot.trusler || []).join('\n');

  renderPestel(s.pestel || []);
  renderHorisonter(s.horisonter || {});
  renderInitiativer(s.initiativer || []);
  renderStrategyMap(s.strategy_map || {});

  // Auto-oppdater dato hvis DL endrer noe
  let dateAutoSet = !s.sist_endret;
  ['f-intensjon', 'f-intensjon_kort', 'f-utkast_status'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      if (dateAutoSet) document.getElementById('f-sist_endret').value = new Date().toISOString().slice(0, 10);
    });
  });

  // Lagre selskap-id globalt for push
  window._aktiv_selskap = selskap;
}

function renderPestel(pestel) {
  const tones = ['opp', 'ned', 'flat'];
  const kats = ['Politikk / juridisk', 'Økonomi', 'Sosialt', 'Teknologi', 'Miljø'];
  const wrap = document.getElementById('f-pestel');
  wrap.innerHTML = pestel.map((p, i) => `
    <div class="list-row">
      <div class="list-row-grid g-pestel">
        <select data-pestel="${i}" data-field="kat">${kats.map(k => `<option value="${k}"${k === p.kat ? ' selected' : ''}>${k}</option>`).join('')}</select>
        <input type="text" data-pestel="${i}" data-field="tekst" value="${escAttr(p.tekst)}">
        <select data-pestel="${i}" data-field="tone">${tones.map(t => `<option value="${t}"${t === p.tone ? ' selected' : ''}>${t}</option>`).join('')}</select>
      </div>
    </div>
  `).join('');
}

function renderHorisonter(h) {
  const wrap = document.getElementById('f-horisonter');
  const scenarios = ['Base', 'Offensiv', 'Bull'];
  wrap.innerHTML = ['h1', 'h2', 'h3'].map(key => {
    const hv = h[key] || { tittel: '', periode: '', fokus: '', scenario: 'Base' };
    return `
      <div class="list-row">
        <span class="list-row-num">${key.toUpperCase()}</span>
        <div class="list-row-grid g-horisont">
          <input type="text" data-horisont="${key}" data-field="tittel" value="${escAttr(hv.tittel)}" placeholder="Tittel">
          <input type="text" data-horisont="${key}" data-field="periode" value="${escAttr(hv.periode)}" placeholder="Periode">
          <select data-horisont="${key}" data-field="scenario">${scenarios.map(sc => `<option value="${sc}"${sc === hv.scenario ? ' selected' : ''}>${sc}</option>`).join('')}</select>
        </div>
        <textarea data-horisont="${key}" data-field="fokus" placeholder="Fokus" style="margin-top:8px;width:100%;min-height:50px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit">${escAttr(hv.fokus)}</textarea>
      </div>
    `;
  }).join('');
}

function renderInitiativer(initiativer) {
  const wrap = document.getElementById('f-initiativer');
  const statuser = ['ikke-startet', 'i-planlegging', 'pa-sporet', 'risiko', 'forsinket', 'fullfort'];
  const ansoffer = ['Markedspenetrasjon', 'Markedsutvikling', 'Produktutvikling', 'Diversifisering'];
  wrap.innerHTML = initiativer.map((it, i) => `
    <div class="list-row" data-init-index="${i}">
      <button class="remove-btn" onclick="removeInitiativ(${i})" title="Fjern initiativ">×</button>
      <div class="list-row-grid g-init">
        <input type="number" data-init="${i}" data-field="nr" value="${it.nr || ''}" placeholder="Nr">
        <input type="text" data-init="${i}" data-field="navn" value="${escAttr(it.navn)}" placeholder="Navn">
        <input type="text" data-init="${i}" data-field="horisont" value="${escAttr(it.horisont || '')}" placeholder="H1 / H2 / H1–H2 …">
        <select data-init="${i}" data-field="status">${statuser.map(st => `<option value="${st}"${st === it.status ? ' selected' : ''}>${st}</option>`).join('')}</select>
      </div>
      <div class="list-row-grid g-init-row2" style="margin-top:8px">
        <input type="text" data-init="${i}" data-field="ansvarlig" value="${escAttr(it.ansvarlig || '')}" placeholder="Ansvarlig">
        <select data-init="${i}" data-field="ansoff">${ansoffer.map(a => `<option value="${a}"${a === it.ansoff ? ' selected' : ''}>${a}</option>`).join('')}</select>
      </div>
      <div class="list-row-grid g-init-row2" style="margin-top:8px">
        <input type="text" data-init="${i}" data-field="mal_2029" value="${escAttr(it.mal_2029 || '')}" placeholder="Mål 2029">
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" data-init="${i}" data-field="fremdrift_pct" value="${it.fremdrift_pct || 0}" min="0" max="100" style="width:80px" placeholder="0–100">
          <span style="font-size:11px;color:var(--muted)">% fremdrift</span>
        </div>
      </div>
      <div style="margin-top:8px">
        <textarea data-init="${i}" data-field="siste_kommentar" placeholder="Siste kommentar (oppdatert dato + status-tekst)" style="width:100%;min-height:50px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit">${escAttr(it.siste_kommentar || '')}</textarea>
      </div>
      <div style="margin-top:6px">
        <input type="date" data-init="${i}" data-field="siste_oppdatering" value="${it.siste_oppdatering || ''}" style="width:160px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);font-family:inherit">
      </div>
    </div>
  `).join('');
}

function renderStrategyMap(sm) {
  const wrap = document.getElementById('f-strategy_map');
  const grupper = [
    { key: 'finansielt', label: 'Finansielt' },
    { key: 'kunde', label: 'Kunde' },
    { key: 'prosess', label: 'Prosess' },
    { key: 'laering', label: 'Læring og vekst' },
  ];
  const statuser = ['ikke-startet', 'ikke-malt', 'i-planlegging', 'pa-sporet', 'risiko', 'oppnaadd'];
  const trender = ['opp', 'ned', 'flat'];
  wrap.innerHTML = grupper.map(g => `
    <div style="margin-bottom:16px">
      <h3 style="margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text)">${g.label}</h3>
      ${(sm[g.key] || []).map((m, i) => `
        <div class="list-row">
          <div class="list-row-grid g-sm">
            <input type="text" data-sm="${g.key}" data-sm-i="${i}" data-field="mal" value="${escAttr(m.mal)}" placeholder="Mål">
            <input type="text" data-sm="${g.key}" data-sm-i="${i}" data-field="baseline" value="${escAttr(m.baseline)}" placeholder="Baseline">
            <input type="text" data-sm="${g.key}" data-sm-i="${i}" data-field="mal_2029" value="${escAttr(m.mal_2029)}" placeholder="Mål 2029">
            <select data-sm="${g.key}" data-sm-i="${i}" data-field="status">${statuser.map(st => `<option value="${st}"${st === m.status ? ' selected' : ''}>${st}</option>`).join('')}</select>
            <select data-sm="${g.key}" data-sm-i="${i}" data-field="trend">${['',...trender].map(t => `<option value="${t}"${t === (m.trend||'') ? ' selected' : ''}>${t || '—'}</option>`).join('')}</select>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function escAttr(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addInitiativ() {
  const wrap = document.getElementById('f-initiativer');
  const current = collectInitiativer();
  const nextNr = Math.max(0, ...current.map(i => parseInt(i.nr) || 0)) + 1;
  current.push({
    nr: nextNr,
    navn: '',
    horisont: 'H1',
    status: 'ikke-startet',
    ansvarlig: 'DL',
    ansoff: 'Markedspenetrasjon',
    mal_2029: '',
    fremdrift_pct: 0,
    siste_kommentar: '',
    siste_oppdatering: null,
    scenario: 'Base+',
  });
  renderInitiativer(current);
}

function removeInitiativ(idx) {
  const current = collectInitiativer();
  current.splice(idx, 1);
  renderInitiativer(current);
}

// =====================================================================
// Samler skjemaverdier til strategi-objekt
// =====================================================================
function collectStrategi() {
  return {
    utkast_status: document.getElementById('f-utkast_status').value,
    sist_endret: document.getElementById('f-sist_endret').value,
    sist_endret_av: document.getElementById('f-sist_endret_av').value.trim(),
    intensjon: document.getElementById('f-intensjon').value.trim(),
    intensjon_kort: document.getElementById('f-intensjon_kort').value.trim(),
    swot: {
      styrker: splitLines('f-swot-styrker'),
      svakheter: splitLines('f-swot-svakheter'),
      muligheter: splitLines('f-swot-muligheter'),
      trusler: splitLines('f-swot-trusler'),
    },
    pestel: collectPestel(),
    horisonter: collectHorisonter(),
    initiativer: collectInitiativer(),
    strategy_map: collectStrategyMap(),
  };
}

function splitLines(id) {
  return document.getElementById(id).value
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean);
}

function collectPestel() {
  const rows = document.querySelectorAll('[data-pestel]');
  const grouped = {};
  rows.forEach(el => {
    const i = el.dataset.pestel;
    grouped[i] = grouped[i] || {};
    grouped[i][el.dataset.field] = el.value;
  });
  return Object.keys(grouped).sort((a, b) => +a - +b).map(i => grouped[i]);
}

function collectHorisonter() {
  const rows = document.querySelectorAll('[data-horisont]');
  const grouped = {};
  rows.forEach(el => {
    const key = el.dataset.horisont;
    grouped[key] = grouped[key] || {};
    grouped[key][el.dataset.field] = el.value;
  });
  return grouped;
}

function collectInitiativer() {
  const rows = document.querySelectorAll('[data-init]');
  const grouped = {};
  rows.forEach(el => {
    const i = el.dataset.init;
    grouped[i] = grouped[i] || {};
    let v = el.value;
    if (el.dataset.field === 'nr' || el.dataset.field === 'fremdrift_pct') v = parseInt(v) || 0;
    if (el.dataset.field === 'siste_oppdatering' && !v) v = null;
    grouped[i][el.dataset.field] = v;
  });
  return Object.keys(grouped).sort((a, b) => +a - +b).map(i => {
    const item = grouped[i];
    // Behold scenario-feltet (ikke editert i form, bruk default)
    if (!item.scenario) item.scenario = 'Base+';
    return item;
  });
}

function collectStrategyMap() {
  const result = { finansielt: [], kunde: [], prosess: [], laering: [] };
  ['finansielt', 'kunde', 'prosess', 'laering'].forEach(gruppe => {
    const rows = document.querySelectorAll(`[data-sm="${gruppe}"]`);
    const grouped = {};
    rows.forEach(el => {
      const i = el.dataset.smI;
      grouped[i] = grouped[i] || {};
      let v = el.value;
      if (el.dataset.field === 'trend' && !v) v = null;
      grouped[i][el.dataset.field] = v;
    });
    result[gruppe] = Object.keys(grouped).sort((a, b) => +a - +b).map(i => grouped[i]);
  });
  return result;
}

// =====================================================================
// Push til Vercel-funksjonen
// =====================================================================
async function pushStrategi() {
  const btn = document.getElementById('push-btn');
  const result = document.getElementById('push-result');
  result.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Pusher…';

  const passord = document.getElementById('f-passord').value;
  if (!passord) {
    showResult('error', 'Skriv inn DL-passord før push.');
    btn.disabled = false;
    btn.textContent = 'Push til main →';
    return;
  }

  const payload = {
    selskap_id: window._aktiv_selskap.id,
    passord: passord,
    dl_navn: document.getElementById('f-sist_endret_av').value.trim() || window._aktiv_selskap.ledelse.dl_kort,
    strategi: collectStrategi(),
  };

  try {
    const res = await fetch(PUSH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      showResult('ok', `Pushet! ${data.message || ''} ${data.commit_url ? `<a href="${data.commit_url}" target="_blank">Se commit på GitHub →</a>` : ''} <br>Pages-deploy starter — strategien er live om ~30 sek. Refresh strategi-dokumentet for å se endringene.`);
    } else {
      showResult('error', 'Push feilet: ' + (data.error || res.status));
    }
  } catch (err) {
    showResult('error', 'Nettverksfeil: ' + err.message + '. Sjekk at Vercel-funksjonen er deployet på ' + PUSH_URL);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Push til main →';
  }
}

function showResult(type, html) {
  const result = document.getElementById('push-result');
  result.innerHTML = `<div class="push-result ${type}">${html}</div>`;
}
</script>

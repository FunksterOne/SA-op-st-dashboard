<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Strategi-analyse — ServiceAlliansen Bygg</title>
<link rel="stylesheet" href="../style.css">
<script>window.SA_BASE = '../';</script>
<script src="../theme.js"></script>
<script src="../selskaper.js"></script>
<style>
  /* =====================================================================
     STRATEGI-ANALYSE — den analytiske grunnen under strategien.
     SWOT (4-kvadrant), PESTEL (5 makro-drivere), Strategy Map (Balanced
     Scorecard med status per KPI). Lest separat fra strategi-doc fordi
     dette typisk oppdateres årlig, ikke ukentlig.
     ===================================================================== */

  .main-content { padding: 0 0 60px }
  .page-header {
    padding: 22px 32px 18px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .page-header .ph-crumb {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em;
    font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .page-header h1 { margin: 6px 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.012em }
  .page-header .ph-sub { color: var(--muted); font-size: 13px; margin-top: 2px }

  .container { padding: 22px 32px; max-width: 1280px }

  /* Intro-banner */
  .intro {
    padding: 18px 22px; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--pending); border-radius: 8px;
    font-size: 13px; line-height: 1.55;
  }
  .intro b { color: var(--text); font-weight: 600 }
  .intro .intro-lbl {
    font-size: 10.5px; color: var(--pending); text-transform: uppercase;
    letter-spacing: 0.12em; font-weight: 700; margin-bottom: 6px;
  }

  /* Panel */
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600 }
  .panel .lead { color: var(--muted); font-size: 12px; margin: 0 0 14px }

  /* SWOT 2x2 */
  .swot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
  @media (max-width: 800px) { .swot { grid-template-columns: 1fr } }
  .swot-quad {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; border-top: 3px solid var(--accent);
  }
  .swot-quad.q-s { border-top-color: var(--good) }
  .swot-quad.q-w { border-top-color: var(--bad) }
  .swot-quad.q-o { border-top-color: var(--hi) }
  .swot-quad.q-t { border-top-color: var(--warn) }
  .swot-quad h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .swot-quad.q-s h3 { color: var(--good) }
  .swot-quad.q-w h3 { color: var(--bad) }
  .swot-quad.q-o h3 { color: var(--hi) }
  .swot-quad.q-t h3 { color: var(--warn) }
  .swot-quad ul { margin: 0; padding: 0; list-style: none }
  .swot-quad li {
    font-size: 12.5px; line-height: 1.45; padding: 6px 0;
    border-bottom: 1px solid var(--line); color: var(--text);
  }
  .swot-quad li:last-child { border-bottom: 0 }
  .swot-quad li::before {
    content: '·'; color: var(--muted); margin-right: 8px; font-weight: 700;
  }
  .swot-quad .count-pill {
    font-size: 10px; color: var(--muted); font-weight: 600;
    background: var(--panel-3); padding: 1px 7px; border-radius: 9px;
  }

  /* PESTEL */
  .pestel { display: grid; gap: 8px }
  .pestel-row {
    display: grid; grid-template-columns: 140px 1fr 24px; gap: 12px; align-items: center;
    padding: 10px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    font-size: 12.5px;
  }
  .pestel-row .kat {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
    color: var(--muted);
  }
  .pestel-row .tone { font-size: 14px; text-align: center }
  .pestel-row .tone.opp { color: var(--good) }
  .pestel-row .tone.ned { color: var(--bad) }
  .pestel-row .tone.flat { color: var(--muted) }

  /* Strategy Map — med status per KPI */
  .smap-section {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px;
    border-left: 4px solid var(--smap-color, var(--accent));
  }
  .smap-section.s-fin { --smap-color: var(--good) }
  .smap-section.s-kunde { --smap-color: var(--hi) }
  .smap-section.s-prosess { --smap-color: var(--warn) }
  .smap-section.s-laering { --smap-color: var(--pending) }
  .smap-section h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--smap-color);
  }
  .smap-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px }
  @media (max-width: 800px) { .smap-grid { grid-template-columns: 1fr } }
  .smap-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; position: relative;
  }
  .smap-card .smap-label {
    font-size: 11px; color: var(--muted); font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .smap-card .smap-status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    background: var(--st-color, var(--muted));
  }
  .smap-card.st-pa-sporet  { --st-color: var(--good) }
  .smap-card.st-oppnaadd   { --st-color: var(--good) }
  .smap-card.st-i-planlegging { --st-color: var(--hi) }
  .smap-card.st-risiko     { --st-color: var(--warn) }
  .smap-card.st-forsinket  { --st-color: var(--bad) }
  .smap-card.st-ikke-startet { --st-color: var(--muted) }
  .smap-card.st-ikke-malt  { --st-color: var(--muted) }
  .smap-card .smap-baseline {
    font-size: 11.5px; margin-top: 4px; color: var(--muted);
  }
  .smap-card .smap-baseline b { color: var(--text); font-weight: 600 }
  .smap-card .smap-target {
    font-size: 12.5px; margin-top: 2px; color: var(--text);
  }
  .smap-card .smap-target b { color: var(--smap-color); font-weight: 700 }
  .smap-card .smap-meta {
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  .smap-card .smap-status-txt {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700; color: var(--st-color, var(--muted));
  }
  .smap-card .smap-trend {
    font-size: 11px; color: var(--muted); margin-left: auto;
  }
  .smap-card .smap-trend.opp { color: var(--good) }
  .smap-card .smap-trend.ned { color: var(--bad) }

  /* Aggregat-strip på toppen av Strategy Map */
  .smap-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px;
  }
  @media (max-width: 800px) { .smap-summary { grid-template-columns: repeat(2, 1fr) } }
  .smap-sum-cell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 14px; border-left: 3px solid var(--ssc, var(--muted));
  }
  .smap-sum-cell .ssc-lbl {
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700;
  }
  .smap-sum-cell .ssc-val {
    font-size: 18px; font-weight: 700; margin-top: 2px; color: var(--text);
  }
  .smap-sum-cell.tone-good { --ssc: var(--good) }
  .smap-sum-cell.tone-warn { --ssc: var(--warn) }
  .smap-sum-cell.tone-bad  { --ssc: var(--bad) }
  .smap-sum-cell.tone-mute { --ssc: var(--muted) }

  /* CTA-bar nederst */
  .cta-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px }
  @media (max-width: 700px) { .cta-bar { grid-template-columns: 1fr } }
  .cta-card {
    padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; text-decoration: none; color: inherit;
    display: flex; gap: 12px; align-items: center; transition: all 0.15s;
  }
  .cta-card:hover { border-color: var(--accent); background: var(--panel-2) }
  .cta-card .cta-arrow { color: var(--accent); font-size: 18px; flex-shrink: 0 }
  .cta-card .cta-title { font-size: 13px; font-weight: 600 }
  .cta-card .cta-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px }

  /* Empty state */
  .empty-state {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 40px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .empty-state h3 { color: var(--text); margin: 0 0 8px }
  .empty-state a { color: var(--accent); text-decoration: none }
</style>
</head>
<body>

<div data-sidebar data-active="strategi-analyse" data-section="strategi"></div>

<main class="main-content">

  <header class="page-header">
    <div class="ph-crumb">
      <span class="mode-pill" data-mode="strategisk">Strategisk</span>
      <span>Strategi-analyse</span>
    </div>
    <h1 id="ph-title">Strategi-analyse</h1>
    <div class="ph-sub" id="ph-sub">SWOT · PESTEL · Strategy Map (Balanced Scorecard) — den analytiske grunnen under strategien.</div>
  </header>

  <div class="container" id="content"></div>
</main>

<script src="../sidebar.js"></script>
<script>
function init() {
  const scope = getActiveScope();
  const content = document.getElementById('content');

  const s = getStrategiForScope(scope);
  if (!s) {
    if (scope.type === 'by') {
      renderEmpty(content, 'Strategi-analyse er per-selskap. Velg et selskap fra scope-velgeren.');
    } else {
      renderEmpty(content, 'Strategi er ikke etablert for valgt scope.');
    }
    return;
  }

  const selskap = getSelskap(scope.id);
  document.getElementById('ph-title').textContent = `Strategi-analyse — ${selskap.label}`;
  document.getElementById('ph-title').style.color = selskap.farge;
  document.getElementById('ph-sub').textContent =
    `${selskap.lokasjon.by} · ${selskap.regnskap_2024.ansatte} ansatte · ${selskap.fagprofil}`;

  let html = '';
  html += renderIntro(s);
  html += renderSwot(s);
  html += renderPestel(s);
  html += renderStrategyMap(s);
  html += renderCtaBar();
  content.innerHTML = html;
}

function renderIntro(s) {
  const dato = s.sist_endret ? formatDatoNorsk(s.sist_endret) : '—';
  return `
    <div class="intro">
      <div class="intro-lbl">Hvordan denne sida brukes</div>
      Dette er <b>fundamentet</b> under strategien — situasjonsbildet, makro-driverne og målestrukturen.
      Til forskjell fra <a href="strategi-fokus.html">Strategi-fokus</a> (det vi snakker om hver uke) og
      <a href="strategi-doc.html">Strategi-dokument</a> (intensjon, horisonter og initiativer), endres
      innholdet her sjelden — typisk én årlig oppdatering, eventuelt ved scenario-skifte. Sist oppdatert: <b>${dato}</b>.
    </div>
  `;
}

function renderSwot(s) {
  const sw = s.swot || {};
  const styrk = sw.styrker || [], svak = sw.svakheter || [], mul = sw.muligheter || [], trus = sw.trusler || [];
  return `
    <div class="panel">
      <h2>Situasjonsanalyse — SWOT</h2>
      <p class="lead">Styrker og svakheter er internt fokus; muligheter og trusler er eksterne. Punktene er kortform — full kontekst i strategi-dokumentet og ROT-markedsmodellen.</p>
      <div class="swot">
        <div class="swot-quad q-s">
          <h3>Styrker <span class="count-pill">${styrk.length}</span></h3>
          <ul>${styrk.map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li style="color:var(--muted);font-style:italic">Ingen registrert</li>'}</ul>
        </div>
        <div class="swot-quad q-w">
          <h3>Svakheter <span class="count-pill">${svak.length}</span></h3>
          <ul>${svak.map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li style="color:var(--muted);font-style:italic">Ingen registrert</li>'}</ul>
        </div>
        <div class="swot-quad q-o">
          <h3>Muligheter <span class="count-pill">${mul.length}</span></h3>
          <ul>${mul.map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li style="color:var(--muted);font-style:italic">Ingen registrert</li>'}</ul>
        </div>
        <div class="swot-quad q-t">
          <h3>Trusler <span class="count-pill">${trus.length}</span></h3>
          <ul>${trus.map(x => `<li>${escapeHtml(x)}</li>`).join('') || '<li style="color:var(--muted);font-style:italic">Ingen registrert</li>'}</ul>
        </div>
      </div>
    </div>
  `;
}

function renderPestel(s) {
  const ps = s.pestel || [];
  if (ps.length === 0) {
    return `
      <div class="panel">
        <h2>Markedsdrivere — PESTEL</h2>
        <p class="lead">Ingen PESTEL-drivere registrert.</p>
      </div>
    `;
  }
  return `
    <div class="panel">
      <h2>Markedsdrivere — PESTEL</h2>
      <p class="lead">Eksterne krefter som påvirker veksten. Pil viser om driveren trekker opp, ned eller er flat for vårt markedssegment.</p>
      <div class="pestel">
        ${ps.map(p => `
          <div class="pestel-row">
            <span class="kat">${escapeHtml(p.kat || '')}</span>
            <span>${escapeHtml(p.tekst || '')}</span>
            <span class="tone ${p.tone || 'flat'}">${p.tone === 'opp' ? '↑' : p.tone === 'ned' ? '↓' : '→'}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderStrategyMap(s) {
  const sm = s.strategy_map || {};
  const allKpis = []
    .concat(sm.finansielt || [], sm.kunde || [], sm.prosess || [], sm.laering || []);
  const total = allKpis.length;
  const onTrack = allKpis.filter(m => m.status === 'pa-sporet' || m.status === 'oppnaadd').length;
  const planning = allKpis.filter(m => m.status === 'i-planlegging').length;
  const risk = allKpis.filter(m => m.status === 'risiko' || m.status === 'forsinket').length;
  const ikkeStartet = allKpis.filter(m => m.status === 'ikke-startet' || m.status === 'ikke-malt').length;

  return `
    <div class="panel">
      <h2>Strategy Map — målbilde 2029</h2>
      <p class="lead">Fire perspektiver (Balanced Scorecard). Finansielle mål nås gjennom kunde- og prosess-mål, som forutsetter læring og bemanning. Status og trend per KPI.</p>
      <div class="smap-summary">
        <div class="smap-sum-cell tone-good">
          <div class="ssc-lbl">På sporet</div>
          <div class="ssc-val">${onTrack} <span style="font-size:11px;color:var(--muted);font-weight:500">/ ${total}</span></div>
        </div>
        <div class="smap-sum-cell tone-${planning > 0 ? 'warn' : 'mute'}">
          <div class="ssc-lbl">I planlegging</div>
          <div class="ssc-val">${planning}</div>
        </div>
        <div class="smap-sum-cell tone-${risk > 0 ? 'bad' : 'mute'}">
          <div class="ssc-lbl">Risiko / forsinket</div>
          <div class="ssc-val">${risk}</div>
        </div>
        <div class="smap-sum-cell tone-mute">
          <div class="ssc-lbl">Ikke startet/målt</div>
          <div class="ssc-val">${ikkeStartet}</div>
        </div>
      </div>
      ${renderSmapSection('s-fin', 'Finansielt', sm.finansielt)}
      ${renderSmapSection('s-kunde', 'Kunde', sm.kunde)}
      ${renderSmapSection('s-prosess', 'Intern prosess', sm.prosess)}
      ${renderSmapSection('s-laering', 'Læring & vekst', sm.laering)}
    </div>
  `;
}

function renderSmapSection(cls, tittel, items) {
  if (!items || items.length === 0) return '';
  return `
    <div class="smap-section ${cls}">
      <h3>${tittel}</h3>
      <div class="smap-grid">
        ${items.map(i => `
          <div class="smap-card st-${i.status || 'ikke-startet'}">
            <div class="smap-label">
              <span class="smap-status-dot"></span>${escapeHtml(i.mal || '')}
            </div>
            <div class="smap-baseline">I dag: <b>${escapeHtml(i.baseline || '—')}</b></div>
            <div class="smap-target">2029: <b>${escapeHtml(i.mal_2029 || '—')}</b></div>
            <div class="smap-meta">
              <span class="smap-status-txt">${statusLabel(i.status)}</span>
              ${i.trend ? `<span class="smap-trend ${i.trend}">${i.trend === 'opp' ? '↑ stigende' : i.trend === 'ned' ? '↓ fallende' : '→ flat'}</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function statusLabel(s) {
  return {
    'pa-sporet': 'På sporet',
    'i-planlegging': 'I planlegging',
    'risiko': 'Risiko',
    'forsinket': 'Forsinket',
    'oppnaadd': 'Oppnådd',
    'ikke-startet': 'Ikke startet',
    'ikke-malt': 'Ikke målt',
  }[s] || (s || 'Ukjent');
}

function renderCtaBar() {
  return `
    <div class="cta-bar">
      <a class="cta-card" href="strategi-doc.html">
        <span class="cta-arrow">⚑</span>
        <div>
          <div class="cta-title">Strategi-dokument</div>
          <div class="cta-sub">Intensjon, Three Horizons, initiativer og scenario-kobling.</div>
        </div>
      </a>
      <a class="cta-card" href="strategi-fokus.html">
        <span class="cta-arrow">★</span>
        <div>
          <div class="cta-title">Strategi-fokus</div>
          <div class="cta-sub">De viktigste tingene nå — kortversjon for DL og styre.</div>
        </div>
      </a>
    </div>
  `;
}

function renderEmpty(content, msg) {
  content.innerHTML = `
    <div class="empty-state">
      <h3>Strategi-analyse ikke tilgjengelig</h3>
      <p>${escapeHtml(msg)}</p>
      <p><a href="strategi-doc.html">→ Tilbake til strategi-dokument</a></p>
    </div>
  `;
}

function formatDatoNorsk(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const mdr = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
  return `${d.getDate()}. ${mdr[d.getMonth()]} ${d.getFullYear()}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

init();
window.addEventListener('scope-changed', init);
</script>
</body>
</html>

<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategi — Scenarier</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="data-loader.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</head>
<body>

<div id="app-mount"></div>

<script>
(async function () {
  const sid = window.getAktivtSelskapId();
  const selskap = window.getSelskap(sid);
  const off = window.SA_CONFIG.scenarier?.[sid]?.find(s => s.id === 'offensiv');

  window.SA.mount({
    active: 'scenarier',
    content: '<div class="page-body"><div style="padding:80px;text-align:center;color:var(--muted);font-family:Geist,sans-serif">Laster…</div></div>',
  });

  let docResult;
  try {
    docResult = await window.DATA.loadStrategi(sid);
  } catch (e) {
    window.SA.mount({
      active: 'scenarier',
      content: `<div class="page-body"><div style="padding:40px;background:#fbe9e9;border-left:3px solid #a83232;color:#a83232;border-radius:4px">Kunne ikke laste: ${e.message}</div></div>`,
    });
    return;
  }

  const pageHd = window.RENDER.renderPageHd({
    crumb: { pill: 'Strategisk', path: `${selskap.label} · Scenarier` },
    title: 'Tre framtider, 2026–2029',
    status: [
      { lab: 'Anbefalt', val: 'Offensiv', cls: 'strong' },
      { lab: 'Kapitalbehov', val: off?.kapitalbehov || '—' },
      { lab: 'Beslutning', val: 'Styremøte 2026-Q3' },
    ],
  });

  const body = `
    <div class="page-body">
      ${window.RENDER.renderScenarier(sid)}
      ${window.RENDER.renderScenarioChart(sid)}
    </div>
  `;

  window.SA.mount({
    active: 'scenarier',
    src: `Modell v1.4 · Brreg-data 2024`,
    content: pageHd + body,
  });
})();
</script>

</body>
</html>

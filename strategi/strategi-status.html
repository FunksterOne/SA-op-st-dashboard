<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Strategi-status — ServiceAlliansen Bygg</title>
<link rel="stylesheet" href="../style.css">
<script>window.SA_BASE = '../';</script>
<script src="../theme.js"></script>
<script src="../selskaper.js"></script>
<style>
  .main-content { padding: 0 0 60px }
  .page-header {
    padding: 22px 32px 18px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .page-header .ph-crumb {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .page-header h1 { margin: 6px 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.012em }
  .page-header .ph-sub { color: var(--muted); font-size: 13px; margin-top: 2px }

  .container { padding: 22px 32px; max-width: 1400px }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600 }
  .panel .lead { color: var(--muted); font-size: 12px; margin: 0 0 14px }

  /* Sammendrag-stripe */
  .sum-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px }
  @media (max-width: 1100px) { .sum-strip { grid-template-columns: repeat(2, 1fr) } }
  .sum-cell {
    padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; border-left: 3px solid var(--sum-color, var(--muted));
  }
  .sum-cell .sum-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600 }
  .sum-cell .sum-val { font-size: 22px; font-weight: 700; margin-top: 2px; color: var(--sum-color, var(--text)) }
  .sum-cell .sum-sub { font-size: 11px; color: var(--muted); margin-top: 2px }
  .sum-cell.s-fullfort      { --sum-color: var(--good) }
  .sum-cell.s-pa-sporet     { --sum-color: var(--good) }
  .sum-cell.s-i-planlegging { --sum-color: var(--hi) }
  .sum-cell.s-risiko        { --sum-color: var(--warn) }
  .sum-cell.s-forsinket     { --sum-color: var(--bad) }
  .sum-cell.s-ikke-startet  { --sum-color: var(--muted) }

  /* Kanban */
  .kanban {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 1100px) { .kanban { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 600px)  { .kanban { grid-template-columns: 1fr } }

  .kb-col {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; min-height: 120px;
    border-top: 3px solid var(--col-color, var(--muted));
  }
  .kb-col.c-ikke-startet  { --col-color: var(--muted) }
  .kb-col.c-i-planlegging { --col-color: var(--hi) }
  .kb-col.c-pa-sporet     { --col-color: var(--good) }
  .kb-col.c-risiko        { --col-color: var(--warn) }
  .kb-col.c-fullfort      { --col-color: var(--good) }
  .kb-col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .kb-col-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--col-color);
  }
  .kb-col-count {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
    background: var(--panel-3); color: var(--muted);
  }
  .kb-cards { display: flex; flex-direction: column; gap: 8px }

  .kb-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-size: 12px;
    border-left: 3px solid var(--col-color, var(--muted));
  }
  .kb-card .kc-head {
    display: flex; gap: 6px; align-items: flex-start; justify-content: space-between;
    margin-bottom: 4px;
  }
  .kb-card .kc-nr {
    font-size: 10px; font-weight: 700; color: var(--muted); padding: 1px 6px;
    background: var(--panel-3); border-radius: 8px; flex-shrink: 0;
  }
  .kb-card .kc-name {
    font-weight: 600; line-height: 1.3; flex: 1; font-size: 12px;
  }
  .kb-card .kc-meta {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
  }
  .kb-card .kc-bar {
    height: 4px; background: var(--panel-3); border-radius: 2px; margin-top: 8px; overflow: hidden;
  }
  .kb-card .kc-bar-fill {
    height: 100%; background: var(--col-color, var(--muted)); border-radius: 2px;
    transition: width 0.3s;
  }
  .kb-card .kc-bar-lbl {
    font-size: 10.5px; color: var(--muted); margin-top: 4px;
    display: flex; justify-content: space-between;
  }
  .kb-card .kc-comment {
    font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 6px;
    padding-top: 6px; border-top: 1px dashed var(--line);
    font-style: italic;
  }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--panel-3); color: var(--muted);
  }
  .pill.h-h1 { background: rgba(88,166,255,0.18); color: var(--hi) }
  .pill.h-h2 { background: rgba(210,153,34,0.18); color: var(--warn) }
  .pill.h-h3 { background: rgba(63,185,80,0.18); color: var(--good) }
  .pill.h-h12 { background: linear-gradient(90deg, rgba(88,166,255,0.18), rgba(210,153,34,0.18)); color: var(--hi) }
  .pill.h-h23 { background: linear-gradient(90deg, rgba(210,153,34,0.18), rgba(63,185,80,0.18)); color: var(--warn) }

  /* Strategy Map pulse */
  .smap-pulse-section {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px;
    border-left: 4px solid var(--smap-color, var(--accent));
  }
  .smap-pulse-section.s-fin { --smap-color: var(--good) }
  .smap-pulse-section.s-kunde { --smap-color: var(--hi) }
  .smap-pulse-section.s-prosess { --smap-color: var(--warn) }
  .smap-pulse-section.s-laering { --smap-color: var(--pending) }
  .smap-pulse-section h3 {
    margin: 0 0 12px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--smap-color);
  }
  .smap-pulse-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  }
  @media (max-width: 800px) { .smap-pulse-grid { grid-template-columns: 1fr } }
  .smap-pulse-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
  }
  .smap-pulse-card .smap-info {
    min-width: 0;
  }
  .smap-pulse-card .smap-label {
    font-size: 11.5px; font-weight: 600; line-height: 1.3;
  }
  .smap-pulse-card .smap-vals {
    font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5;
  }
  .smap-pulse-card .smap-vals b { color: var(--text); font-weight: 600 }
  .smap-pulse-card .smap-status {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    flex-shrink: 0;
  }
  .smap-pulse-card .status-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--status-color, var(--muted));
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--status-color, var(--muted));
  }
  .smap-pulse-card .trend-arrow {
    font-size: 14px; line-height: 1; color: var(--trend-color, var(--muted));
    font-weight: 700;
  }
  .smap-pulse-card.st-oppnaadd      { --status-color: var(--good) }
  .smap-pulse-card.st-pa-sporet     { --status-color: var(--good) }
  .smap-pulse-card.st-risiko        { --status-color: var(--warn) }
  .smap-pulse-card.st-forsinket     { --status-color: var(--bad) }
  .smap-pulse-card.st-ikke-startet  { --status-color: var(--muted) }
  .smap-pulse-card.st-i-planlegging { --status-color: var(--hi) }
  .smap-pulse-card.st-ikke-malt     { --status-color: var(--muted) }
  .smap-pulse-card.tr-opp  { --trend-color: var(--good) }
  .smap-pulse-card.tr-ned  { --trend-color: var(--bad) }
  .smap-pulse-card.tr-flat { --trend-color: var(--muted) }

  .empty-state {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 40px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .empty-state h3 { color: var(--text); margin: 0 0 8px }
  .empty-state a { color: var(--accent); text-decoration: none }
  .empty-state a:hover { text-decoration: underline }

  .last-update {
    font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 8px;
  }
</style>
</head>
<body>

<div data-sidebar data-active="strategi-status" data-section="strategi"></div>

<main class="main-content">

  <header class="page-header">
    <div class="ph-crumb">
      <span class="mode-pill" data-mode="strategisk">Strategisk</span>
      <span>Strategi-status</span>
    </div>
    <h1 id="ph-title">Strategi-status</h1>
    <div class="ph-sub" id="ph-sub">Initiativ-fremdrift · Strategy Map pulse</div>
  </header>

  <div class="container" id="content"></div>
</main>

<script src="../sidebar.js"></script>
<script>
const STATUS_LABEL = {
  'ikke-startet':   'Ikke startet',
  'i-planlegging':  'I planlegging',
  'pa-sporet':      'På sporet',
  'risiko':         'Risiko',
  'forsinket':      'Forsinket',
  'fullfort':       'Fullført',
  'oppnaadd':       'Oppnådd',
  'ikke-malt':      'Ikke målt',
};

function init() {
  const scope = getActiveScope();
  const content = document.getElementById('content');

  const s = getStrategiForScope(scope);
  if (!s) {
    content.innerHTML = `
      <div class="empty-state">
        <h3>Strategi-status ikke tilgjengelig</h3>
        <p>Strategi-status krever at scope har et etablert strategi-dokument. Velg et selskap fra scope-velgeren.</p>
        <p><a href="strategi-doc.html">← Strategi-dokument</a></p>
      </div>
    `;
    return;
  }

  // Header
  const lbl = getScopeLabel(scope);
  document.getElementById('ph-title').textContent = `Strategi-status — ${lbl.label}`;
  document.getElementById('ph-title').style.color = lbl.farge;
  document.getElementById('ph-sub').textContent =
    `${s.initiativer.length} initiativer · Strategy Map pulse · sist oppdatert ${getLastUpdate(s)}`;

  let html = '';

  // 0. Utkast-banner
  html += renderStrategiDraftBanner(s);

  // 1. Sammendrag-stripe — antall per status
  const counts = countByStatus(s.initiativer);
  html += `
    <div class="sum-strip">
      ${renderSumCell('s-pa-sporet',     counts['pa-sporet'] || 0,     'På sporet',     'Initiativ med jevnt fremdrift')}
      ${renderSumCell('s-i-planlegging', counts['i-planlegging'] || 0, 'I planlegging', 'Aktivert, ikke i drift ennå')}
      ${renderSumCell('s-risiko',        (counts['risiko'] || 0) + (counts['forsinket'] || 0), 'Risiko / forsinket', 'Krever oppmerksomhet')}
      ${renderSumCell('s-ikke-startet',  counts['ikke-startet'] || 0,  'Ikke startet',  'Avhenger av scenario-valg / fremtidig horisont')}
      ${renderSumCell('s-fullfort',      counts['fullfort'] || 0,      'Fullført',      'Ferdige initiativ')}
    </div>
  `;

  // 2. Kanban — initiativ gruppert etter status
  html += `
    <div class="panel">
      <h2>Initiativ-fremdrift</h2>
      <p class="lead">Hvert kort viser fremdrift, ansvarlig, horisont og siste kommentar. Sortert i kolonner etter status.</p>
      <div class="kanban">
        ${renderKanbanCol('ikke-startet',  'Ikke startet',  s.initiativer)}
        ${renderKanbanCol('i-planlegging', 'I planlegging', s.initiativer)}
        ${renderKanbanCol('pa-sporet',     'På sporet',     s.initiativer)}
        ${renderKanbanCol('risiko',        'Risiko / forsinket', s.initiativer, ['risiko', 'forsinket'])}
      </div>
    </div>
  `;

  // 3. Strategy Map pulse
  html += `
    <div class="panel">
      <h2>Strategy Map — pulse 2029-mål</h2>
      <p class="lead">Status og trend per mål. Trafikklys: grønn = på sporet/oppnådd, gul = risiko, rød = forsinket, grå = ikke målt.</p>
      ${renderSmapPulse('s-fin',      'Finansielt',      s.strategy_map.finansielt)}
      ${renderSmapPulse('s-kunde',    'Kunde',           s.strategy_map.kunde)}
      ${renderSmapPulse('s-prosess',  'Intern prosess',  s.strategy_map.prosess)}
      ${renderSmapPulse('s-laering',  'Læring & vekst',  s.strategy_map.laering)}
    </div>
  `;

  content.innerHTML = html;
}

function countByStatus(initiativer) {
  const c = {};
  initiativer.forEach(i => {
    c[i.status] = (c[i.status] || 0) + 1;
  });
  return c;
}

function getLastUpdate(s) {
  const dates = s.initiativer.map(i => i.siste_oppdatering).filter(Boolean);
  if (dates.length === 0) return '—';
  return dates.sort().reverse()[0];
}

function renderSumCell(cls, n, lbl, sub) {
  return `
    <div class="sum-cell ${cls}">
      <div class="sum-lbl">${lbl}</div>
      <div class="sum-val">${n}</div>
      <div class="sum-sub">${sub}</div>
    </div>
  `;
}

function renderKanbanCol(statusKey, label, all, multipleStatuses = null) {
  const matches = multipleStatuses
    ? all.filter(i => multipleStatuses.includes(i.status))
    : all.filter(i => i.status === statusKey);
  return `
    <div class="kb-col c-${statusKey}">
      <div class="kb-col-head">
        <span class="kb-col-title">${label}</span>
        <span class="kb-col-count">${matches.length}</span>
      </div>
      <div class="kb-cards">
        ${matches.length === 0
          ? '<div style="color:var(--muted);font-size:11.5px;text-align:center;padding:14px 6px">Ingen</div>'
          : matches.map(i => renderKanbanCard(i, statusKey)).join('')}
      </div>
    </div>
  `;
}

function renderKanbanCard(i, statusKey) {
  return `
    <div class="kb-card c-${statusKey}">
      <div class="kc-head">
        <span class="kc-nr">#${i.nr}</span>
      </div>
      <div class="kc-name">${i.navn}</div>
      <div class="kc-meta">
        <span class="pill ${horisontClass(i.horisont)}">${i.horisont}</span>
        <span style="font-size:10.5px;color:var(--muted)">${i.ansvarlig}</span>
      </div>
      <div class="kc-bar"><div class="kc-bar-fill" style="width:${i.fremdrift_pct}%"></div></div>
      <div class="kc-bar-lbl">
        <span>${i.fremdrift_pct} %</span>
        <span>2029-mål: ${i.mal_2029}</span>
      </div>
      ${i.siste_kommentar ? `<div class="kc-comment">${i.siste_oppdatering ? '<b style="color:var(--text);font-style:normal">' + i.siste_oppdatering + ':</b> ' : ''}${i.siste_kommentar}</div>` : ''}
    </div>
  `;
}

function renderSmapPulse(cls, tittel, items) {
  return `
    <div class="smap-pulse-section ${cls}">
      <h3>${tittel}</h3>
      <div class="smap-pulse-grid">
        ${items.map(i => {
          const trendCls = i.trend === 'opp' ? 'tr-opp' : i.trend === 'ned' ? 'tr-ned' : i.trend === 'flat' ? 'tr-flat' : '';
          const trendArrow = i.trend === 'opp' ? '↑' : i.trend === 'ned' ? '↓' : i.trend === 'flat' ? '→' : '';
          return `
            <div class="smap-pulse-card st-${i.status} ${trendCls}">
              <div class="smap-info">
                <div class="smap-label">${i.mal}</div>
                <div class="smap-vals">Nå: <b>${i.baseline}</b><br>2029: <b>${i.mal_2029}</b></div>
                <div style="font-size:10.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600">${STATUS_LABEL[i.status] || i.status}</div>
              </div>
              <div class="smap-status">
                <div class="status-dot"></div>
                ${trendArrow ? `<div class="trend-arrow">${trendArrow}</div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function horisontClass(h) {
  if (h === 'H1')    return 'h-h1';
  if (h === 'H2')    return 'h-h2';
  if (h === 'H3')    return 'h-h3';
  if (h === 'H1–H2') return 'h-h12';
  if (h === 'H2–H3') return 'h-h23';
  if (h === 'H2+')   return 'h-h2';
  return '';
}

init();
window.addEventListener('scope-changed', init);
</script>
</body>
</html>

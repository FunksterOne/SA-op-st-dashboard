<style>
  .main-content { padding: 0 0 60px }

  }
  .page-header .ph-crumb {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;

  .page-header .ph-meta-row {
    display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px;
  }
  .page-header .ph-meta-row b { color: var(--text); font-weight: 600 }
  .priority-badge {
    display: inline-block; padding: 4px 10px; border-radius: 11px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-left: 6px;
    vertical-align: middle;
  }
  .priority-badge.high { background: var(--bad-soft); color: var(--bad) }
  .priority-badge.med  { background: var(--warn-soft); color: var(--warn) }
  .priority-badge.low  { background: var(--panel-3); color: var(--muted) }
  .priority-badge.opp  { background: var(--hi-soft); color: var(--hi) }

  .container { padding: 22px 32px; max-width: 1280px }

  .summary-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px;
  }
  @media (max-width: 1100px) { .summary-row { grid-template-columns: repeat(2, 1fr) } }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600 }
  .panel .lead { color: var(--muted); font-size: 12px; margin: 0 0 14px }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr } }

  /* Strategic fit-score */
  .fit-grid { display: grid; gap: 10px }
  .fit-bar { display: grid; grid-template-columns: 180px 1fr 50px; gap: 12px; align-items: center; font-size: 12.5px }
  .fit-bar .label { color: var(--muted); font-size: 11.5px }
  .fit-bar .bar {
    height: 8px; background: var(--panel-3); border-radius: 4px; overflow: hidden;
  }
  .fit-bar .fill { height: 100%; border-radius: 4px; background: var(--accent-2) }
  .fit-bar .fill.good { background: var(--good) }
  .fit-bar .fill.warn { background: var(--warn) }
  .fit-bar .fill.bad  { background: var(--bad) }
  .fit-bar .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600 }

  .why-section { padding: 14px 16px; background: var(--panel-2); border-radius: 6px;
    border-left: 3px solid var(--good); }
  .why-section.risk { border-left-color: var(--warn) }
  .why-section h3 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 700; color: var(--good);
  }
  .why-section.risk h3 { color: var(--warn) }
  .why-section ul { margin: 0; padding-left: 20px }
  .why-section li { margin-bottom: 5px; font-size: 12.5px; line-height: 1.5 }

  /* Tabell */
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px }
  .tbl th {
    text-align: left; padding: 10px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
  }
  .tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line) }
  .tbl tr:last-child td { border-bottom: 0 }
  .tbl tr.total { font-weight: 600; background: var(--panel-2) }
  .tbl tr.total td { border-top: 2px solid var(--line) }

  /* Sekvensering tidslinje */
  .timeline { display: grid; gap: 10px }
  .timeline-step {
    display: grid; grid-template-columns: 80px 1fr; gap: 14px; padding: 11px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    border-left: 3px solid var(--accent); font-size: 12.5px;
  }
  .timeline-step .ts-q {
    font-size: 10px; color: var(--accent-2); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 700;
  }
  .timeline-step .ts-text b { font-weight: 600 }
  .timeline-step .ts-text .det { color: var(--muted); font-size: 11.5px; margin-top: 2px; line-height: 1.5 }

  /* DD-sjekkliste */
  .dd-list { display: grid; gap: 6px }
  .dd-item {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center;
    padding: 9px 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 5px; font-size: 12px;
  }
  .dd-item .dd-check {
    width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px;
    flex-shrink: 0;
  }
  .dd-item.priority-h .dd-check { border-color: var(--bad) }
  .dd-item.priority-m .dd-check { border-color: var(--warn) }
  .dd-item.priority-l .dd-check { border-color: var(--muted) }

  .dd-item .dd-text .det { color: var(--muted); font-size: 11px; margin-top: 1px; line-height: 1.4 }
  .dd-item .dd-prio {

    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .dd-item.priority-h .dd-prio { background: var(--bad-soft); color: var(--bad) }
  .dd-item.priority-m .dd-prio { background: var(--warn-soft); color: var(--warn) }
  .dd-item.priority-l .dd-prio { background: var(--panel-3); color: var(--muted) }

  .empty-state {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 36px; text-align: center; color: var(--muted); font-size: 13px;

</style>

function getQueryParam(name) {
  return new URLSearchParams(location.search).get(name);
}

function getKandidatById(id) {
  return KANDIDATER.find(k => k.id === id);
}

function fmtPct(v, dec = 1) { return v == null ? '—' : v.toFixed(dec).replace('.', ',') + ' %' }
function fmtMNOK(v) { return v == null ? '—' : v.toFixed(1).replace('.', ',') + ' M' }

function init() {
  const id = getQueryParam('id');
  const k = id ? getKandidatById(id) : null;

  if (!k) {
    document.getElementById('kandidat-content').innerHTML = `
      <div class="empty-state">
        Kandidaten ble ikke funnet. Gå til <a href="ma-screening-bodo.html">M&A-screening Bodø</a> eller
        <a href="ma-screening-trondheim.html">Trondheim</a>.
      </div>`;
    return;
  }

  // Sett scope-screening-link riktig
  const screeningHref = k.by === 'trondheim' ? 'ma-screening-trondheim.html' : 'ma-screening-bodo.html';
  document.getElementById('cr-screening').href = screeningHref;
  document.getElementById('cr-screening').textContent = `M&A-screening ${k.by === 'trondheim' ? 'Trondheim' : 'Bodø'}`;
  document.getElementById('cr-name').textContent = `${k.rang} · ${k.navn}`;

  document.getElementById('ph-title').innerHTML = `${k.navn}<span class="priority-badge ${k.priority}">${k.priorityLabel}</span>`;
  document.getElementById('ph-meta-row').innerHTML = `
    <span>Org.nr: <b>${k.orgnr}</b></span>
    <span>NACE: <b>${k.nace}</b></span>
    <span>Ansatte: <b>${k.ansatte}</b></span>
    <span>Stiftet: <b>${k.stiftet}</b></span>
    <span>By: <b>${k.by === 'trondheim' ? 'Trondheim' : 'Bodø'}</b></span>
  `;

  // Render content
  const c = document.getElementById('kandidat-content');
  const marginCls = k.driftsmargin_pct < 0 ? 'bad' : k.driftsmargin_pct < 4 ? 'warn' : 'good';
  c.innerHTML = `
    <div class="summary-row">
      <div class="sa-kpi">
        <div class="sa-kpi-label">Omsetning 2024</div>
        <div class="sa-kpi-value">${fmtMNOK(k.omsetning_mnok)}</div>
        <div class="sa-kpi-detail">Brreg-tall</div>
      </div>
      <div class="sa-kpi ${marginCls}">
        <div class="sa-kpi-label">Driftsmargin</div>
        <div class="sa-kpi-value">${fmtPct(k.driftsmargin_pct)}</div>
        <div class="sa-kpi-detail">EBIT ${fmtMNOK(k.driftsresultat_mnok)}</div>
      </div>
      <div class="sa-kpi hi">
        <div class="sa-kpi-label">Ansatte</div>
        <div class="sa-kpi-value">${k.ansatte}</div>
        <div class="sa-kpi-detail">${k.nace}</div>
      </div>
      <div class="sa-kpi">
        <div class="sa-kpi-label">Tilstand</div>
        <div class="sa-kpi-value" style="font-size:14px;line-height:1.2;margin-top:6px">${k.tilstand}</div>
      </div>
      <div class="sa-kpi">
        <div class="sa-kpi-label">Kjøpspris-anslag</div>
        <div class="sa-kpi-value" style="font-size:13px;line-height:1.2;margin-top:6px">${k.kjopspris}</div>
        <div class="sa-kpi-detail">Total: ${k.pris_total}</div>
      </div>
    </div>

    <div class="panel">
      <h2>Strategisk sammendrag</h2>
      <p style="margin: 0; font-size: 13px; line-height: 1.6">${k.strap}</p>
    </div>

    <div class="panel">
      <h2>Strategisk fit-score</h2>
      <p class="lead">Fire dimensjoner — strategisk passing, kjøpspris-attraktivitet, integrasjons-letthet, synergi-potensial.</p>
      <div class="fit-grid">
        ${[
          ['Strategisk fit', k.fit_score.strategisk, 'matcher NACE-kjerne og marked'],
          ['Pris-attraktivitet', k.fit_score.pris, 'jo høyere, jo billigere'],
          ['Integrasjons-letthet', k.fit_score.integrasjon, 'jo høyere, jo enklere absorbere'],
          ['Synergi-potensial', k.fit_score.synergi, 'forventet gevinst i tilbud og kostnader'],
        ].map(([lbl, val, det]) => {
          const cls = val >= 80 ? 'good' : val >= 60 ? 'warn' : 'bad';
          return `
            <div class="fit-bar">
              <span class="label">${lbl}<br><span style="color:var(--muted);font-size:10px">${det}</span></span>
              <span class="bar"><span class="fill ${cls}" style="width:${val}%"></span></span>
              <span class="num">${val}</span>
            </div>`;
        }).join('')}
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h2>Strategisk verdi</h2>
        <div class="why-section">
          <h3>Hvorfor strategisk verdi</h3>
          <ul>${k.verdi.map(v => `<li>${v}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="panel">
        <h2>Risikoer og forutsetninger</h2>
        <div class="why-section risk">
          <h3>Risiko</h3>
          <ul>${k.risiko.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Pris-modell</h2>
      <p class="lead">Komponentvis nedbrytning av estimert totalpris (mockup — verifiseres i DD).</p>
      <table class="tbl">
        <thead><tr><th>Komponent</th><th class="num">MNOK</th><th>Kommentar</th></tr></thead>
        <tbody>
          ${k.pris.map(p => `<tr><td>${p.post}</td><td class="num">${p.mnok}</td><td style="color:var(--muted)">${p.kommentar}</td></tr>`).join('')}
          <tr class="total"><td>Total estimert</td><td class="num">${k.pris_total}</td><td></td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Sekvensering</h2>
      <p class="lead">Tidslinje fra sondering til ferdig integrasjon.</p>
      <div class="timeline">
        ${k.sekvens.map(s => `
          <div class="timeline-step">
            <span class="ts-q">${s.q}</span>
            <span class="ts-text"><b>${s.t}</b><div class="det">${s.d}</div></span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>DD-sjekkliste</h2>
      <p class="lead">Hva må kartlegges i due diligence. Prioritet H = blokkerende, M = viktig, L = nice-to-have.</p>
      <div class="dd-list">
        ${k.dd.map(d => `
          <div class="dd-item priority-${d.prio}">
            <span class="dd-check"></span>
            <span class="dd-text"><b>${d.tema}</b><div class="det">${d.det}</div></span>
            <span class="dd-prio">${d.prio === 'h' ? 'Høy' : d.prio === 'm' ? 'Mid' : 'Lav'}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
